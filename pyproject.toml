[build-system]
requires = ["setuptools>=69,<85"]
build-backend = "setuptools.build_meta"

[project]
name = "emberbench"
dynamic = ["version"]  # from src/emberbench/_version.py, see docs/versioning.md
description = "A deterministic benchmark for decision-making models on dynamic fire-evacuation tasks"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
emberbench = "emberbench.cli:main"

[project.optional-dependencies]
# build and setuptools: the leak-guard and CLI wheel tests and CI build the wheel and sdist without network isolation.
# Ranges stop before the next incompatible release; CI installs the exact pins in
# tools/dev-constraints.txt (see docs/release-checklist.md, "Development tool constraints").
dev = ["pytest>=8,<10", "mypy>=1.10,<3", "build>=1,<2", "setuptools>=69,<85"]

[tool.setuptools.dynamic]
version = { attr = "emberbench._version.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
emberbench = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests", "tools"]
addopts = "-ra"

[tool.mypy]
strict = true
files = ["src", "tests"]
mypy_path = ["src", "tests", "tools"]
